# third_party/sources.lock.yaml
#
# Provenance records for every vendored or reference source copied into
# third_party/. Schema:
#
#   <slug>:                 # directory name under third_party/
#     upstream_url:         # exact origin
#     upstream_commit:      # full 40-char commit or tag
#     license:              # SPDX id
#     sha256:               # upstream archive/file hash
#     derived_into:         # libs path that consumes the derived code (optional)
#     authorizing_wp:       # Work Package that approved the reuse
#     notes:                # modification record / MODIFICATIONS.md pointer

name: ci

# WP-002 CI baseline: expose Linux / Windows / macOS build problems at PR time.
#
#   * Full three-platform matrix builds the real product presets (`dev` on all
#     OSes, `asan` additionally on Linux for ASan/UBSan).
#   * CI reuses the repository presets (`cmake --preset …`, `ctest --preset …`)
#     verbatim; it never re-spells compile flags.
#   * Caches cover dependency *downloads only* (vcpkg tool checkout and the
#     vcpkg binary cache). Test results are never cached.
#   * On failure we upload build/test logs generated on the runner. The path
#     list never includes corpus or user data, and runner-generated logs carry
#     no developer-machine absolute paths.
#
# The WP-00A `deps-smoke` gate stays separate (pinned-version lock check); this
# workflow is the product build baseline.
#
# The GUI target is omitted on CI by design: Qt is optional at configure time
# (WP-001) and not present on hosted runners. Installing a pinned Qt kit on CI
# is a separate follow-up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})${{ matrix.sanitize && ' · ASan/UBSan' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: true
          - os: windows-latest
            sanitize: false
          - os: macos-latest
            sanitize: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # catch2's vcpkg port runs vcpkg_fixup_pkgconfig and needs pkg-config at
      # build time. Windows obtains it through vcpkg automatically; Linux and
      # macOS require the system tool (bootstrap spec §7.1).
      - name: Provide pkg-config (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Provide pkg-config (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install pkg-config

      # The windows-latest image puts MinGW's c++ ahead of MSVC on PATH, so
      # CMake's Ninja auto-detection picks GCC while vcpkg installs MSVC-ABI
      # (x64-windows) dependencies -> every Catch2 symbol becomes an undefined
      # reference at link time (Itanium vs MSVC name mangling). Source the
      # official VS DevShell (shipped with the runner; no third-party action)
      # so CMake selects cl and the toolchain matches the vcpkg ABI. GitHub
      # runs each step in its own process, so persist the environment for the
      # configure/build/test steps below.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools not found via vswhere" }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-ChildItem env: | ForEach-Object {
            Add-Content -Path $env:GITHUB_ENV -Value "$($_.Name)=$($_.Value)"
          }

      # Download-only caches. Keys cover OS and dependency-lock content so a
      # cache hit can never serve wrong-version or cross-platform artifacts.
      - name: Cache vcpkg tool checkout
        uses: actions/cache@v4
        with:
          path: .deps/vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.py') }}
          restore-keys: |
            vcpkg-tool-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/dependencies.lock.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Static dependency audit
        shell: bash
        run: python scripts/verify_dependencies.py

      - name: Repository layout audit
        shell: bash
        run: python scripts/verify_repository_layout.py

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: python scripts/bootstrap.py

      - name: Configure dev
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: cmake --preset dev

      - name: Build dev
        shell: bash
        run: cmake --build --preset dev

      - name: Test dev
        shell: bash
        run: ctest --preset dev

      - name: Package smoke
        shell: bash
        run: python scripts/run_package_smoke.py

      - name: Configure asan (Linux)
        if: matrix.sanitize
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: cmake --preset asan

      - name: Build asan (Linux)
        if: matrix.sanitize
        shell: bash
        run: cmake --build --preset asan

      - name: Test asan (Linux)
        if: matrix.sanitize
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --preset asan

      # Runner-generated logs only (CMake/ninja/ctest/vcpkg); no corpus, no
      # user data, no developer-machine paths.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-logs
          path: |
            **/CMakeFiles/*.log
            **/CMakeFiles/*.yaml
            **/stdouterr.log
            **/vcpkg-manifest-install.log
            **/*.ninja_log
            build/dev/Testing/Temporary/LastTest.log
            build/asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # WP-603D: exercise the optional libFuzzer harness on a hosted toolchain
  # that provides the LLVM fuzzer runtime.  Keeping this separate from the
  # product matrix prevents the coverage preset from changing the normal
  # compiler/ABI contract while making runtime evidence a required CI gate.
  coverage-fuzz:
    name: coverage-fuzz (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide LLVM fuzzer toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm pkg-config
          fuzzer_package="$(apt-cache search '^libfuzzer-[0-9]+-dev$' | awk '{print $1}' | sort -V | tail -n 1)"
          if [[ -z "${fuzzer_package}" ]]; then
            echo "No versioned libFuzzer development package is available" >&2
            exit 1
          fi
          sudo apt-get install -y "${fuzzer_package}"

      - name: Cache vcpkg tool checkout
        uses: actions/cache@v4
        with:
          path: .deps/vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.py') }}
          restore-keys: |
            vcpkg-tool-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/dependencies.lock.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Static dependency audit
        shell: bash
        run: python scripts/verify_dependencies.py

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: python scripts/bootstrap.py

      - name: Run coverage-guided fuzz evidence
        shell: bash
        env:
          CC: clang
          CXX: clang++
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: |
          python scripts/run_coverage_fuzz.py --seconds 10
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/coverage-fuzz/evidence.json").read_text())
          if report.get("status") != "PASS":
              raise SystemExit(f"coverage fuzz did not produce PASS evidence: {report}")
          PY

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fuzz-evidence
          path: build/coverage-fuzz/evidence.json
          if-no-files-found: ignore

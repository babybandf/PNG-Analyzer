# records describe files materialized by pnga_generate_wp607c_corpus in
# the build tree only; their records must equal the generator catalog
# (index.json) projection exactly, and expected_sha256 values are
# blessed only through the double-generation flow of
# scripts/verify_wp607c_manifest.py --refresh-generated-hashes.

